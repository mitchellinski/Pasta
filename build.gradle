plugins {
    id 'org.springframework.boot' version '2.6.7'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.9'
}

group = 'com.pastaebasta.eist'
version = '1.0.0'
sourceCompatibility = '17'
compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation:2.7.0'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation group: 'javax.persistence', name: 'javax.persistence-api', version: '2.2'
    implementation group: 'org.reactivestreams', name: 'reactive-streams', version: '1.0.4'
//    implementation 'org.reactivestreams:reactive-streams:1.0.4'
    implementation 'com.google.maps:google-maps-services:2.1.0'
//    implementation 'org.slf4j:slf4j-simple:1.7.25'
    implementation 'com.google.api-client:google-api-client:1.33.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.32.1'
    implementation 'com.google.apis:google-api-services-calendar:v3-rev20211026-1.32.1'
    implementation group: 'com.dlsc', name: 'GMapsFX', version: '11.0.6'

//    implementation group: 'com.lynden', name: 'GMapsFX', version: '2.12.0'
//    implementation 'com.github.dlsc-software-consulting-gmbh:GMapsFX:master-SNAPSHOT'
//    implementation 'com.github.jitpack:gradel-simple:master-SNAPSHOT'
}

configurations {
    all*.exclude module: 'spring-boot-starter-logging'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'resources'
        }
    }
    test {
        java {
            srcDir 'src/test/java'
        }
        resources {
            'src/test/resources'
        }
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('test') {
    useJUnitPlatform()
}

javafx {
    version = "16"
    modules = ['javafx.controls', 'javafx.swing', 'javafx.fxml', 'javafx.web']
}

mainClassName = 'com.pastaebasta.eist.view.Start'